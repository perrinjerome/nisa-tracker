name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools and project
        run: pip install ty ruff -e .
      - name: Type check
        run: ty check .
      - name: Lint
        run: ruff check .
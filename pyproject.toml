[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisa-tracker"
version = "0.1.0"
description = "Follow the value of a Japanese NISA account"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0",
    "requests>=2.28",
]

[project.scripts]
nisa-app = "app:main"
nisa-fetch = "fetch:main"

[tool.setuptools]
py-modules = ["app", "db", "fetch"]